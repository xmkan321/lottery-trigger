name: Trigger DLT Check

on:
  schedule:
    # 22:30 Beijing time (UTC+8) = 14:30 UTC
    # DLT draws on Monday(1), Wednesday(3), Saturday(6)
    - cron: '30 14 * * 1,3,6'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DLT workflow
        env:
          TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/xmkan321/lottery-checker/actions/workflows/dlt.yml/dispatches")
          echo "Trigger status: $STATUS"
          if [ "$STATUS" = "204" ]; then
            echo "DLT workflow triggered successfully"
          else
            echo "Failed to trigger DLT workflow"
            exit 1
          fi
