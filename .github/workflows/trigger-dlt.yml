name: Trigger DLT Check

on:
  schedule:
    # 22:30 Beijing (14:30 UTC) - Primary trigger
    # 22:35 Beijing (14:35 UTC) - Backup (auto-skips if already ran)
    # DLT draws on Monday(1), Wednesday(3), Saturday(6)
    - cron: '30 14 * * 1,3,6'
    - cron: '35 14 * * 1,3,6'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DLT workflow (with dedup check)
        env:
          TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          # Calculate 30 minutes ago for dedup check
          SINCE=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Checking for DLT runs since $SINCE ..."

          # Check if lottery-checker already has a recent DLT run
          RECENT=$(curl -s -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/xmkan321/lottery-checker/actions/workflows/dlt.yml/runs?per_page=5")

          COUNT=$(echo "$RECENT" | jq '[.workflow_runs[] | select(.created_at >= "'$SINCE'")] | length')
          echo "Recent DLT runs in last 30min: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "DLT already triggered recently, skipping duplicate"
            exit 0
          fi

          echo "No recent run found, triggering DLT workflow..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/xmkan321/lottery-checker/actions/workflows/dlt.yml/dispatches")

          echo "Trigger status: $STATUS"
          if [ "$STATUS" = "204" ]; then
            echo "DLT workflow triggered successfully"
          else
            echo "Failed to trigger DLT workflow"
            exit 1
          fi
