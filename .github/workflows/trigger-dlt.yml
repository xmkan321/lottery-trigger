name: Trigger DLT Check (Manual Backup)

# NOTE: Schedule disabled. cron-job.org is now the primary reliable trigger.
# This workflow is kept as a MANUAL backup - run it from the Actions tab
# only if cron-job.org fails to trigger the DLT check.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DLT workflow
        env:
          TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/xmkan321/lottery-checker/actions/workflows/dlt.yml/dispatches")
          echo "Trigger status: $STATUS"
          if [ "$STATUS" = "204" ]; then
            echo "DLT workflow triggered successfully"
          else
            echo "Failed to trigger DLT workflow"
            exit 1
          fi
