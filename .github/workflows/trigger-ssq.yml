name: Trigger SSQ Check

on:
  schedule:
    # 22:30 Beijing time (UTC+8) = 14:30 UTC
    # SSQ draws on Sunday(0), Tuesday(2), Thursday(4)
    - cron: '30 14 * * 0,2,4'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SSQ workflow
        env:
          TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/xmkan321/lottery-checker/actions/workflows/ssq.yml/dispatches")
          echo "Trigger status: $STATUS"
          if [ "$STATUS" = "204" ]; then
            echo "SSQ workflow triggered successfully"
          else
            echo "Failed to trigger SSQ workflow"
            exit 1
          fi
